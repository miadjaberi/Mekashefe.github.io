<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کافه سرکتاب میعاد (نسخه تست fix)</title>
  <style>
    body { margin:0; font-family: Tahoma, sans-serif; background:#1e2a3a; color:#fff; }
    #status { text-align:center; padding:60px 20px; }
    #status .spinner { width:40px; height:40px; border:4px solid #ffcc00; border-top-color:transparent; border-radius:50%; margin:20px auto; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="status">
    <div class="spinner"></div>
    <p>در حال بارگذاری برنامه...</p>
    <p style="font-size:0.85em;color:#aaa;">شاخه fix · محاسبه همزاد فعال است</p>
  </div>
  <script>
    (async function() {
      try {
        // بارگذاری نسخه اصلی از main
        const res = await fetch('https://cdn.jsdelivr.net/gh/miadjaberi/Mekashefe.github.io@main/index.html?v=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();

        // استخراج body و head برای جایگزینی امن‌تر
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // کپی استایل‌ها و لینک‌ها
        document.head.innerHTML = doc.head.innerHTML;
        document.title = doc.title || 'کافه سرکتاب میعاد';

        // کپی بدنه
        document.body.innerHTML = doc.body.innerHTML;

        // اجرای اسکریپت‌های اصلی (به جز external که دوباره لود می‌شوند)
        const scripts = doc.querySelectorAll('script');
        for (const old of scripts) {
          const s = document.createElement('script');
          if (old.src) {
            s.src = old.src;
            s.async = false;
          } else {
            s.textContent = old.textContent;
          }
          document.body.appendChild(s);
        }

        // بارگذاری ماژول همزاد (تزریق خودکار UI)
        const hamzad = document.createElement('script');
        hamzad.src = 'hamzad.js?v=' + Date.now();
        document.body.appendChild(hamzad);

      } catch (e) {
        document.getElementById('status').innerHTML =
          '<p style="color:#ff6b6b;">خطا در بارگذاری</p><p style="font-size:0.9em;">' +
          (e.message || e) +
          '</p><p><a href="https://miadjaberi.github.io/Mekashefe.github.io/" style="color:#ffcc00;">باز کردن نسخه اصلی (main)</a></p>';
      }
    })();
  </script>
</body>
</html>
